<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Keyboard Overlay</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="overlay" id="dragRegion">
    <div class="keyboard">
      <div class="row">
        <div class="key" data-key="Backquote">~</div>
        <div class="key" data-key="1">1</div>
        <div class="key" data-key="2">2</div>
        <div class="key" data-key="3">3</div>
        <div class="key" data-key="4">4</div>
        <div class="key" data-key="5">5</div>
      </div>
      <div class="row">
        <div class="key wide" data-key="Tab">TAB</div>
        <div class="key" data-key="Q">Q</div>
        <div class="key" data-key="W">W</div>
        <div class="key" data-key="E">E</div>
        <div class="key" data-key="R">R</div>
        <div class="key" data-key="T">T</div>
      </div>
      <div class="row indent">
        <div class="key" data-key="A">A</div>
        <div class="key" data-key="S">S</div>
        <div class="key" data-key="D">D</div>
        <div class="key" data-key="F">F</div>
        <div class="key" data-key="G">G</div>
      </div>
      <div class="row">
        <div class="key wide" data-key="Shift">SHIFT</div>
        <div class="key" data-key="Z">Z</div>
        <div class="key" data-key="X">X</div>
        <div class="key" data-key="C">C</div>
        <div class="key" data-key="V">V</div>
        <div class="key" data-key="B">B</div>
        <div class="key arrow-up" data-key="ArrowUp">↑</div>
      </div>
      <div class="row">
        <div class="key wide" data-key="Ctrl">CTRL</div>
        <div class="key wide" data-key="Alt">ALT</div>
        <div class="key spacebar" data-key="Space"></div>
        <div class="key" data-key="ArrowLeft">←</div>
        <div class="key" data-key="ArrowDown">↓</div>
        <div class="key" data-key="ArrowRight">→</div>
      </div>
    </div>

    <div class="mouse">
      <svg viewBox="0 0 160 220" xmlns="http://www.w3.org/2000/svg">
        <path class="mouse-btn" data-button="left"
          d="M80 8 C50 8 34 26 30 56 L30 92 L78 92 L78 8 Z" />
        <path class="mouse-btn" data-button="right"
          d="M80 8 C110 8 126 26 130 56 L130 92 L82 92 L82 8 Z" />
        <line class="mouse-divider" x1="80" y1="8" x2="80" y2="92" />
        <rect class="mouse-wheel" x="72" y="30" width="16" height="26" rx="8" />
        <path class="mouse-body"
          d="M30 92 L130 92 L130 150 C130 190 108 212 80 212 C52 212 30 190 30 150 Z" />
      </svg>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
